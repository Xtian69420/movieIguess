<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    (function() {
      const canonicalOrigin = 'https://movie-i-guess.web.app';
      const localHosts = [
        'localhost',
        '127.0.0.1',
        '0.0.0.0',
        '::1'
      ];
      const isLocalHost =
        localHosts.includes(window.location.hostname);

      if (
        window.location.origin !== canonicalOrigin &&
        !isLocalHost &&
        window.location.protocol.startsWith('http')
      ) {
        window.location.replace(
          canonicalOrigin +
          window.location.pathname +
          window.location.search +
          window.location.hash
        );
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#141414" />
  <title>MovieIGuess</title>
  <link rel="icon" href="src/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/new-ui/netflix-ui.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="src/new-ui/netflix-ui.js"></script>
</body>
</html>
