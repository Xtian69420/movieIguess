<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <script>
      (function() {
        function redirectToCanonical() {
          const canonicalOrigin = 'https://movie-i-guess.web.app';
          const localHosts = ['localhost', '127.0.0.1', '0.0.0.0', '::1'];
          const isLocalHost = localHosts.includes(window.location.hostname);
          const isHttp = window.location.protocol.startsWith('http');
          const isCanonicalRoot = window.location.origin === canonicalOrigin && (window.location.pathname === '/' || window.location.pathname === '');

          if (isHttp && !isLocalHost && !isCanonicalRoot) {
            window.location.replace(canonicalOrigin + '/');
          }
        }

        redirectToCanonical();
        window.addEventListener('pageshow', redirectToCanonical);
      })();
    </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#141414" />
  <title>MovieIGuess</title>
  <link rel="icon" href="src/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/new-ui/netflix-ui.css" />
</head>
<body>
  <div id="app"></div>
  <script src="src/new-ui/download-provider.js"></script>
  <script type="module" src="src/new-ui/netflix-ui.js"></script>
</body>
</html>
